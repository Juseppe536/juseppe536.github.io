<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Кирилл Котлов: видеомонтаж, цветокоррекция, моушен и обучение DaVinci Resolve.">
<title>Кирилл Котлов Монтаж</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with Telegram, home = hero + portfolio grid of 9 categories + 3 lesson teasers; category view = gallery; fullscreen viewer with arrows */
:root{
  --bg:#0d0e10;
  --bg-2:#16171a;
  --panel:#1c1d21;
  --panel-2:#232429;
  --line:#2c2e33;
  --fg:#e9e6df;
  --muted:#8e9097;
  --gold:#c9a24c;
  --gold-hi:#e0bd6a;
  --gold-deep:#7d6229;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--body);font-size:16px;line-height:1.55;color:var(--fg);
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 80% -10%,#24252b 0%,transparent 60%),
                   linear-gradient(180deg,#141518 0%,var(--bg) 40%);
  background-attachment:fixed;
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(13,14,16,.92)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,14,16,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand .dot{width:10px;height:10px;border-radius:50%;background:#d0453a;box-shadow:0 0 10px #d0453a;flex:none;animation:rec 2s infinite}
@keyframes rec{50%{opacity:.35}}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:6px}
.nav a.link{font-size:14px;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:8px}
.nav a.link:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-weight:600;font-size:14px;text-decoration:none;
  padding:10px 16px;border-radius:999px;border:1px solid var(--gold);color:#16120a;background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:0 0 0 0 rgba(201,162,76,.0);transition:box-shadow .2s,transform .2s;cursor:pointer;white-space:nowrap}
.btn:hover{box-shadow:0 0 24px rgba(201,162,76,.45);transform:translateY(-1px)}
.btn svg{width:16px;height:16px;flex:none}
.btn.ghost{background:transparent;color:var(--gold-hi)}
.btn.ghost:hover{background:rgba(201,162,76,.1)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
@media (max-width:640px){.brand span,.nav a.link{display:none}.btn .long{display:none}}

/* hero */
.hero{padding-block:56px 28px}
.tc{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1.04;margin:14px 0 18px;text-wrap:balance;letter-spacing:.005em}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:#c3c1bb;max-width:60ch;font-size:17px;margin:0 0 26px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px}

/* timeline strip */
.strip{margin-top:38px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);position:relative;overflow:hidden}
.strip .ruler{position:absolute;inset:0 0 auto;height:14px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px);opacity:.8}
.strip .clips{position:absolute;inset:16px 0 6px;display:flex;gap:3px;padding:0 6px}
.strip .clips i{display:block;height:100%;border-radius:3px;opacity:.85}
.strip .head{position:absolute;top:0;bottom:0;width:2px;background:var(--gold-hi);left:0;animation:play 14s linear infinite;box-shadow:0 0 8px var(--gold)}
@keyframes play{to{left:100%}}
@media (prefers-reduced-motion:reduce){.strip .head,.brand .dot{animation:none}}

/* sections */
section.block{padding-block:40px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:6px 0 0;line-height:1.1}
.sec-head p{margin:0;color:var(--muted);max-width:46ch}

/* category grid */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1000px){.cats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.cats{grid-template-columns:1fr}}
.cat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:168px;padding:18px;border-radius:14px;text-decoration:none;
  background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .2s}
.cat::before{content:"";position:absolute;inset:0;background:var(--tone);opacity:.55;transition:opacity .3s}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(13,14,16,.92))}
.cat:hover{border-color:var(--gold);transform:translateY(-2px)}
.cat:hover::before{opacity:.8}
.cat > *{position:relative;z-index:1}
.cat .meta{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:auto;position:absolute;top:16px;left:18px;right:18px;z-index:1}
.cat{min-height:224px}
.cat p{padding-right:44px}
.cat h3{font-size:clamp(17px,1.55vw,20px)}
@media (min-width:421px){.cat{container-type:inline-size}
.cat h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:min(20px,6.8cqi)}.cat p{min-height:3.1em}}
.cat .ico{width:46px;height:46px;color:var(--gold-hi);display:block}
.cat .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat .ico .f{fill:currentColor;stroke:none}
.cat .ico .d{opacity:.45}
.cat .meta .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cat:hover .ico{color:#fff}
.cat .bgimg{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:.18;z-index:0;transition:opacity .3s}
.cat.has-bg::before{opacity:.25}
.cat.has-bg:hover .bgimg{opacity:.28}
.cat .meta .fmt{border:1px solid rgba(233,230,223,.25);border-radius:4px;padding:2px 6px;color:#d8d5ce}
.cat h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px;line-height:1.15}
.cat p{margin:0;font-size:14px;color:#bdbbb5}
.cat .go{position:absolute;right:16px;bottom:18px;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold-deep);color:var(--gold-hi);transition:background .2s}
.cat:hover .go{background:var(--gold);color:#16120a}

/* video cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.grid.vert{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;padding:0;color:inherit;font:inherit}
.vert .thumb{aspect-ratio:9/16}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.thumb .ph{position:absolute;inset:0;background:var(--tone)}
.thumb .ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.thumb .play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(13,14,16,.6);border:1px solid rgba(224,189,106,.7);display:grid;place-items:center;transition:transform .2s,background .2s}
.thumb .play svg{width:20px;height:20px;margin-left:3px;fill:var(--gold-hi)}
.thumb:hover .play{transform:scale(1.08);background:var(--gold)}
.thumb:hover .play svg{fill:#16120a}
.thumb .dur{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:4px}
.thumb .badge{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(201,162,76,.18);color:var(--gold-hi);border:1px solid rgba(201,162,76,.4);padding:2px 6px;border-radius:4px}
.thumb .cv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px;text-align:left;
  background:rgba(0,0,0,.6)}
.thumb .cv .ctag{position:absolute;top:26px;left:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#16120a;background:var(--gold);padding:3px 7px;border-radius:4px}
.thumb .cv .chead{font-family:var(--display);font-size:clamp(17px,1.6vw,22px);line-height:1.08;color:#fff;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.8),0 2px 14px rgba(0,0,0,.7)}
.thumb .cv .chead::first-line{color:var(--gold-hi)}
.thumb.has-cv .play{top:40%}
.thumb .cv::before{content:"";position:absolute;left:14px;right:14px;top:14px;height:2px;background:linear-gradient(90deg,var(--gold) 0 30%,rgba(255,255,255,.25) 30%)}
.card h4{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}

/* lessons */
.learn{border:1px solid var(--line);border-radius:18px;padding:28px;background:linear-gradient(160deg,#1d1c18 0%,var(--bg-2) 60%)}
@media (max-width:520px){.learn{padding:18px}}
.learn .grid{grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.learn .grid{grid-template-columns:1fr}}
.learn .cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.learn .cta p{margin:0;color:#c3c1bb;max-width:52ch}

/* category view */
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:32px}
.back{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 14px;font:500 14px var(--body);cursor:pointer}
.back:hover{border-color:var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:18px 6px;scrollbar-width:thin}
.tabs a{flex:none;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tabs a.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(201,162,76,.08)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:32px;color:var(--muted);text-align:center}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(6,6,8,.96);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(10px,env(safe-area-inset-left,0px))}
.viewer .top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-family:var(--mono);font-size:12px;padding:4px 6px 10px}
.viewer .top .r{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.icon-btn svg{width:18px;height:18px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage video,.stage .ph-big{max-width:100%;max-height:100%;border-radius:10px;background:#000}
.stage .ph-big{position:relative;aspect-ratio:16/9;width:min(100%,1100px);display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}
.stage .ph-big.v{aspect-ratio:9/16;width:auto;height:100%;max-height:78vh}
.stage .ph-big .bg{position:absolute;inset:0;opacity:.7}
.stage .ph-big div.msg{position:relative;max-width:36ch;color:#d8d5ce;font-size:15px}
.stage .ph-big div.msg b{display:block;font-family:var(--display);font-weight:400;font-size:20px;margin-bottom:6px;color:var(--fg)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1px solid rgba(224,189,106,.5);background:rgba(13,14,16,.7);color:var(--gold-hi);display:grid;place-items:center;cursor:pointer;z-index:2}
.arrow:hover{background:var(--gold);color:#16120a}
.arrow svg{width:22px;height:22px}
.arrow.prev{left:4px}.arrow.next{right:4px}
.viewer .info{max-width:820px;margin:14px auto 0;text-align:center;padding:0 8px}
.modes{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel);margin-bottom:10px}
.modes button{font:600 13px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
.modes button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#16120a}
.modes button:not(.on):hover{color:var(--fg)}
.thumb .dur.pb{color:var(--gold-hi);z-index:1;top:23px;right:14px;bottom:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border:1px solid rgba(224,189,106,.45)}
.viewer .info h4{margin:0 0 4px;font-size:17px}
.viewer .info p{margin:0;color:var(--muted);font-size:14px}

footer{border-top:1px solid var(--line);margin-top:30px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:24px;color:var(--muted);font-size:14px}
</style>
</head>

/* --- Яндекс Диск: получаем обложку и ссылку на файл по публичной ссылке --- */
const cache = new Map();
function resolveYandex(link){
  if(!link) return Promise.resolve(null);
  if(cache.has(link)) return cache.get(link);
  const api = "https://cloud-api.yandex.net/v1/disk/public/resources";
  const p = (async () => {
    const key = encodeURIComponent(link);
    const [meta, dl] = await Promise.all([
      fetch(`${api}?public_key=${key}&preview_size=XL`).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(`${api}/download?public_key=${key}`).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    return { poster: meta && meta.preview || null, src: dl && dl.href || null };
  })();
  cache.set(link,p);
  return p;
}

function thumbHTML(v, tone, badge){
  return `<button class="thumb${v.cover?" has-cv":""}" data-link="${esc(v.link)}" aria-label="Смотреть: ${esc(v.title)}">
    <span class="ph" style="--tone:${tone};background:${tone}"></span>
    ${v.poster?`<img src="${esc(v.poster)}" alt="" loading="lazy">`:""}
    ${badge?`<span class="badge">${esc(badge)}</span>`:""}
    ${v.cover?`<span class="cv"><span class="ctag">${esc(v.tag||"")}</span><span class="chead">${esc(v.cover)}</span></span>`:""}
    <span class="play">${playIcon}</span>
    ${v.dur?`<span class="dur">${esc(v.dur)}</span>`:""}
    ${v.process?`<span class="dur pb">Процесс + результат</span>`:""}
  </button>`;
}
function hydrateThumbs(root){
  root.querySelectorAll(".thumb[data-link]").forEach(t=>{
    const link=t.dataset.link; if(!link || t.querySelector("img")) return;
    resolveYandex(link).then(r=>{
      if(r && r.poster){ const img=new Image(); img.alt=""; img.decoding="async"; img.onload=()=>t.insertBefore(img,t.querySelector(".cv")||t.querySelector(".play")); img.src=r.poster; }
    });
  });
}

function stripHTML(){
  const cols=["#5a2a3a","#2f4a3a","#3b3a33","#2c3360","#4a2a5c","#5c4520","#1f4a52","#5a2722","#3d3524"];
  const w=[9,5,12,4,7,10,6,8,5,11,4,9,6,7];
  return `<div class="strip" aria-hidden="true"><div class="ruler"></div><div class="clips">${w.map((x,i)=>`<i style="flex:${x};background:${cols[i%cols.length]}"></i>`).join("")}</div><div class="head"></div></div>`;
}

    <section class="block" style="padding-top:18px">
      <div class="sec-head">
        <div><div class="tc">${esc(c.fmt)} · ${c.videos.length} ${plural(c.videos.length)}</div><h2>${esc(c.title)}</h2></div>
        <p>${esc(c.short)}</p>
      </div>
      ${c.videos.length?`<div class="grid ${c.vertical?"vert":""}">
        ${c.videos.map(v=>`<div class="card">${thumbHTML(v,c.tone)}<h4>${esc(v.title)}</h4><p>${esc(v.desc)}</p></div>`).join("")}
      </div>`:`<div class="empty">Скоро здесь появятся работы.</div>`}
    </section>
  </div>`;
  app.querySelectorAll(".grid .thumb").forEach((t,i)=>t.addEventListener("click",()=>openViewer(c.videos,i,!!c.vertical,c.tone)));
  hydrateThumbs(app);
  window.scrollTo(0,0);
}

function plural(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"видео";return"видео";}

/* --- навигация по #якорям --- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(PORTFOLIO.some(c=>c.id===h)) renderCategory(h);
  else renderHome(h==="portfolio"||h==="learn"?h:null);
}
document.addEventListener("click",e=>{
  const back=e.target.closest("[data-back]");
  if(back){ e.preventDefault(); location.hash="portfolio"; return; }
  const home=e.target.closest("[data-home]");
  if(home && app.querySelector(".crumb")){ e.preventDefault(); const t=home.getAttribute("href").slice(1); location.hash=t==="top"?"":t; if(t==="top") renderHome(); }
});
window.addEventListener("hashchange",route);

/* --- полноэкранный просмотр --- */
const viewer=$("#viewer"), stage=$("#v-stage");
let list=[], idx=0, isVert=false, tone="";
function openViewer(l,i,v,t){ mode="result"; list=l; idx=i; isVert=v; tone=t||"linear-gradient(135deg,#4b3a1a,#15120b)"; viewer.hidden=false; document.body.style.overflow="hidden"; show(); }
function closeViewer(){ stage.innerHTML=""; viewer.hidden=true; document.body.style.overflow=""; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
let mode="result";
async function show(){
  const v=list[idx];
  const vm=$("#v-modes"); vm.hidden=!v.process; if(!v.process) mode="result";
  vm.querySelectorAll("button").forEach(b=>{const on=b.dataset.mode===mode; b.classList.toggle("on",on); b.setAttribute("aria-selected",on);});
  const link = mode==="process"&&v.process ? v.process : v.link;
  $("#v-count").textContent=`${String(idx+1).padStart(2,"0")} / ${String(list.length).padStart(2,"0")}`;
  $("#v-title").textContent=v.title; $("#v-desc").textContent=v.desc||"";
  const arrows = list.length>1?`<button class="arrow prev" aria-label="Предыдущее видео"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><button class="arrow next" aria-label="Следующее видео"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>`:"";
  const placeholder = msg => `<div class="ph-big ${isVert?"v":""}"><div class="bg" style="background:${tone}"></div><div class="msg"><b>${esc(v.title)}</b>${msg}</div></div>`;
  stage.innerHTML = (link?placeholder("Загружаю видео…"):placeholder("Здесь будет видео. Вставьте ссылку на Яндекс Диск в настройках сайта.")) + arrows;
  bindArrows();
  if(!link) return;
  const my=idx, myMode=mode, r=await resolveYandex(link);
  if(my!==idx || myMode!==mode || viewer.hidden) return;
  if(r && r.src){
    stage.innerHTML = `<video src="${esc(r.src)}" ${r.poster?`poster="${esc(r.poster)}"`:""} controls autoplay playsinline></video>` + arrows;
    bindArrows();
  } else {
    stage.querySelector(".msg").innerHTML = `<b>${esc(v.title)}</b>Не удалось загрузить видео. Проверьте, что ссылка на Яндекс Диск публичная.`;
  }
}
function bindArrows(){
  const p=stage.querySelector(".prev"), n=stage.querySelector(".next");
  if(p) p.onclick=()=>step(-1); if(n) n.onclick=()=>step(1);
}
function step(d){ idx=(idx+d+list.length)%list.length; mode="result"; show(); }
$("#v-modes").addEventListener("click",e=>{const b=e.target.closest("button[data-mode]"); if(!b||b.dataset.mode===mode) return; mode=b.dataset.mode; show();});
$("#v-close").onclick=closeViewer;
$("#v-full").onclick=()=>{ (document.fullscreenElement?document.exitFullscreen():viewer.requestFullscreen?.())?.catch?.(()=>{}); };
viewer.addEventListener("click",e=>{ if(e.target===stage) closeViewer(); });
document.addEventListener("keydown",e=>{
  if(viewer.hidden) return;
  if(e.key==="Escape") closeViewer();
  if(e.key==="ArrowRight") step(1);
  if(e.key==="ArrowLeft") step(-1);
});
let sx=null;
stage.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx<0?1:-1); sx=null; });

route();
</script>
